name: DataCore Full-Stack CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Tests & Django Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Checks
        working-directory: backend
        run: python manage.py check

      - name: Run Django Automated Test Suite
        working-directory: backend
        env:
          SECRET_KEY: 'ci-secret-key-not-for-production-usage'
          DJANGO_SECRET_KEY: 'ci-secret-key-not-for-production-usage'
          DATABASE_URL: 'sqlite:///test_datacore_ci.sqlite3'
        run: python manage.py test

  admin-dashboard-build:
    name: Admin Dashboard TypeCheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'admin-dashboard/package-lock.json'

      - name: Install Dashboard Dependencies
        working-directory: admin-dashboard
        run: npm ci

      - name: Build Dashboard (Typecheck & Vite)
        working-directory: admin-dashboard
        run: npm run build

  flutter-app-analysis:
    name: Flutter Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Analyze Dart Source Code
        working-directory: mobile-app
        run: flutter analyze lib/ --no-fatal-infos

      - name: Run Mobile Unit & Widget Tests
        working-directory: mobile-app
        run: flutter test
