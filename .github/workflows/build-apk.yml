name: Build DataCore Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API Base URL (e.g. https://datacore-backend.onrender.com)'
        required: false
        default: 'https://datacore-backend.onrender.com'
        type: string
      create_release:
        description: 'Publish as a downloadable GitHub Release in addition to Workflow Artifact'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Generate Android project scaffolding if missing
        working-directory: mobile-app
        run: |
          if [ ! -d "android" ]; then
            echo "android/ directory not found in mobile-app. Generating scaffolding with flutter create..."
            flutter create --platforms=android --org com.datacore --project-name datacore_mobile .
          else
            echo "android/ directory exists."
          fi

      - name: Ensure Internet Permission in AndroidManifest.xml
        working-directory: mobile-app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              echo "Injecting INTERNET permission into $MANIFEST"
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
            else
              echo "INTERNET permission already present in $MANIFEST"
            fi
          fi

      - name: Install Flutter dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: mobile-app
        env:
          TARGET_API_URL: ${{ inputs.api_base_url || 'https://datacore-backend.onrender.com' }}
        run: |
          echo "Building Release APK with API_BASE_URL: $TARGET_API_URL"
          flutter build apk --release --dart-define=API_BASE_URL="$TARGET_API_URL"

      - name: Verify APK Generated
        run: |
          ls -la mobile-app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataCore-Android-APK
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name || 'Latest APK Build' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('apk-{0}', github.run_number) }}
          body: |
            ### DataCore Customer Mobile Application (Android APK)

            - **Build Number:** `${{ github.run_number }}`
            - **Commit:** `${{ github.sha }}`
            - **Backend API URL:** `${{ inputs.api_base_url || 'https://datacore-backend.onrender.com' }}`
            
            Download `app-release.apk` below and install directly on your Android device.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
