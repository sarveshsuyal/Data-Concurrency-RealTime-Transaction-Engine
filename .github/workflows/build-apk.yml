name: Build Customer App APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Cache Flutter Pub Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            mobile-app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile-app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Flutter Dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: mobile-app
        run: flutter build apk --release --dart-define=API_BASE_URL=https://datacore-backend-wktd.onrender.com

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataCore-CustomerApp-Release-APK
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          name: "DataCore Customer App ${{ github.ref_name }}"
          generate_release_notes: true
